<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="640" viewBox="0 0 1024 640">
  <rect width="1024" height="640" fill="white"/>
  <!-- the arc, three bands -->
  <path d="M 30 260 Q 512 20 994 150" fill="none" stroke="black" stroke-width="13"/>
  <path d="M 30 306 Q 512 66 994 196" fill="none" stroke="black" stroke-width="13"/>
  <path d="M 30 352 Q 512 112 994 242" fill="none" stroke="black" stroke-width="13"/>
  <!-- far ridge -->
  <path d="M 0 545 L 160 515 L 330 540 L 520 505 L 700 542 L 870 512 L 1024 538"
        fill="none" stroke="black" stroke-width="12"/>
  <!-- clear sky behind the figure so the far ridge reads as passing behind it -->
