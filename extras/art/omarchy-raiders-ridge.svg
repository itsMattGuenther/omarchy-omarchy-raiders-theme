  <!-- near ridge -->
  <path d="M 0 606 L 180 592 L 340 574 L 520 600 L 740 584 L 900 604 L 1024 596"
        fill="none" stroke="black" stroke-width="14"/>
  <!-- the raider: the one solid mass -->
  <g fill="black">
    <circle cx="348" cy="420" r="22"/>
    <rect x="318" y="452" width="60" height="18" rx="8"/>
    <rect x="328" y="468" width="40" height="58"/>
    <rect x="307" y="462" width="17" height="46" rx="6"/>
    <rect x="372" y="466" width="12" height="48" rx="6"/>
    <rect x="332" y="524" width="13" height="52"/>
    <rect x="356" y="524" width="13" height="52"/>
  </g>
</svg>
