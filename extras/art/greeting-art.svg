  <circle cx="48" cy="28" r="1.15" fill="#f5c518"/>
  <g fill="none" stroke-linecap="round">
    <path d="M 4 62 L 14 60 L 23 62 M 52 60 L 65 55 L 76 59 L 86 56 L 107 60" stroke="#7fa0ee" stroke-width="0.7"/>
    <path d="M 7 68 L 23 67 L 31 65 L 47 65 L 58 68 L 78 67 L 91 69 L 105 68" stroke="#c08a62" stroke-width="0.85"/>
