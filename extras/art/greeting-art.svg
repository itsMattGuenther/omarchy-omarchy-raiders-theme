    <circle cx="14" cy="19" r="0.7"/><circle cx="56" cy="10" r="0.65"/>
    <circle cx="99" cy="37" r="0.6"/><circle cx="65" cy="33" r="0.6"/>
  </g>
  <path d="M 88 8 A 9 9 0 1 0 95 22 A 8.4 8.4 0 0 1 88 8 Z" fill="#eae2ce"/>
  <path d="M 71 18 H 75 M 73 16 V 20" stroke="#f5c518" stroke-width="0.8"/>
